[package]
name = "neko-editor"
description = "The Neko editor and project manager."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "neko"
path = "src/main.rs"

[dependencies]
neko = { workspace = true, features = ["window-sdl3", "window-winit", "render-wgpu", "render-soft", "gamepad-sdl3"] }
neko-ui.workspace = true
neko-soft = { workspace = true, default-features = false }
neko-wgpu.workspace = true
png.workspace = true
serde.workspace = true
dirs.workspace = true
toml.workspace = true
log.workspace = true

[build-dependencies]
# Rasterizes the vendored Godot SVGs into one atlas at build time.
resvg.workspace = true
